name: Generate VIP Café Video

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'make_video.py'

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate video
        run: python make_video.py

      - name: Commit & push video
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output_video.mp4
          git commit -m "Auto-generated video [skip ci]" || echo "No changes to commit"
          git push

